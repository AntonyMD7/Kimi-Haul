name: Public calculator checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check tools/business-calculators.mjs

      - name: Run built-in Node tests
        run: node --test tests/business-calculators.test.mjs

      - name: Verify public documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/business-calculators.mjs
          test -s tests/business-calculators.test.mjs
          test -s docs/PUBLIC-BUSINESS-CALCULATORS.md
